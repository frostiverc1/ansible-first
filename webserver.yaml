---
- name: Configure nginx server
  hosts: webservers
  become: yes

  # this is for the templates/.j2 file. if not using it then you can comment this out.
  vars:
    site_title: "Ansible demo site"
    heading: "Well hello there!"
    body_text: "Jinja 2 template rendered by ansible"


  tasks:
    - name: install nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: create deploy user
      user:
        name: deploy
        groups: sudo
        shell: /bin/bash
        state: present
        create_home: yes

    - name: install ufw firewall
      apt:
        name: ufw
        state: present
        # update_cache: yes            # why run twice? commented
      
    - name: allow ssh through the firewall
      ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: allow http through the firewall
      ufw:
        rule: allow
        port: "80"
        proto: tcp
    
    - name: enable the firewall
      ufw:
        state: enabled
        policy: deny


    - name: deploy nginx default config
      template:
        src: templates/nginx-default.conf.j2
        dest: /etc/nginx/sites-available/default
        owner: root
        group: root
        mode: "0644"
      notify: reload nginx

    - name: make sure nginx is up and running
      service:
        name: nginx
        state: started
        enabled: yes

    - name: deploy templates/index.html.j2

      # copy:  # use this if you are not using jinja2 templating           
      template:
        src: templates/index.html.j2
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: "0644"

  handlers:
    - name: reload nginx
      service:
        name: nginx
        state: reloaded